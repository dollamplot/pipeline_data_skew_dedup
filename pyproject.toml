[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dollamplot-pipeline_data_skew_dedup"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出多模态评测工程师·流水线的数据倾斜上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dollamplot" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dollamplot.github.io"
Repository = "https://github.com/dollamplot/pipeline_data_skew_dedup"
Issues = "https://github.com/dollamplot/pipeline_data_skew_dedup/issues"

[project.scripts]
pipeline_data_skew_dedup = "pipeline_data_skew_dedup:main"

[tool.setuptools]
py-modules = ["pipeline_data_skew_dedup"]
